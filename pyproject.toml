[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent-ai"
version = "0.1.0"
description = "Agentic workflow for Fantasy Premier League: ingest, forecast, optimize, execute."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "PuLP>=2.7.0",
    "scikit-learn>=1.3.0",
    "playwright>=1.40.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-mock>=3.12.0"]

[project.scripts]
fpl-agent = "fpl_agent.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
